apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn # Name of the volume. Will mount at /var/mnt/longhorn
volumeType: disk # Volume type.
provisioning:
  diskSelector:
    match: disk.size > 1000000000000u # 1 TB
filesystem:
    type: xfs # Filesystem type. Default is `xfs`.

