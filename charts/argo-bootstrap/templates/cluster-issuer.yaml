---
# cert-manager ClusterIssuer using the Cloudflare DNS-01 challenge.
# Cloudflare is authoritative for the cluster's zone (see dns-zones.tf), so the
# solver authenticates with an API token rather than a Route 53 IRSA role.
#
# The referenced Secret is created by Terraform in the cert-manager namespace
# (cert-manager.tf) — a ClusterIssuer resolves secretRefs in the cert-manager
# controller's own namespace, not in the namespace of the Certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "{{ required "letsencryptEmail is required" .Values.letsencryptEmail }}"
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: "{{ .Values.cloudflareApiTokenSecretName }}"
              key: "{{ .Values.cloudflareApiTokenSecretKey }}"
        selector:
          dnsZones:
            - "{{ required "domainName is required" .Values.domainName }}"
