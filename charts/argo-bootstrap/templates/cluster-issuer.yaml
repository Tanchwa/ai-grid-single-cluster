---
# cert-manager ClusterIssuer using Route53 DNS-01 challenge.
# The cert-manager ServiceAccount uses IRSA (no static credentials here);
# the IAM role ARN is set on the ServiceAccount during the cert-manager Helm install.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "{{ .Values.letsencryptEmail }}"
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          route53:
            region: ap-east-2
            hostedZoneID: "{{ .Values.route53ZoneId }}"
