apiVersion: v1
kind: Secret
metadata:
  name: default-repo-secret
  labels:
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  url: "https://github.com/{{ .Values.githubOrganizationName }}"
  name: private-argo-repo
  # project: default leave unscoped to allow all projects to use this credential
  githubAppID: "{{ .Values.githubApplicationId }}"
  githubAppInstallationID: "{{ .Values.githubApplicationInstallationId }}"
  githubAppPrivateKey: {{ .Values.githubApplicationPrivateKey | toJson }}
